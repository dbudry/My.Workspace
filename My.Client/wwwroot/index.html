<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <script>
        // Dev-only: LOCAL bar + no-cache on localhost debug ports only (7047/5047/11256).
        (function () {
            var host = (location.hostname || '').toLowerCase();
            var port = String(location.port || '');
            if (host.endsWith('.azurestaticapps.net') || host.endsWith('.azurewebsites.net'))
                return;
            var loopback = host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '::1';
            var localPort = port === '7047' || port === '5047' || port === '11256';
            if (!(loopback && localPort)) return;

            var hideKey = 'ws.localEnvBannerHiddenUntil';
            var hideMs = 5 * 60 * 1000;
            var restoreTimer;

            function hiddenUntil() {
                try { return parseInt(localStorage.getItem(hideKey) || '0', 10) || 0; }
                catch (e) { return 0; }
            }
            function isHidden() { return hiddenUntil() > Date.now(); }

            var meta = document.createElement('meta');
            meta.httpEquiv = 'Cache-Control';
            meta.content = 'no-store, no-cache, must-revalidate';
            document.head.appendChild(meta);
            document.querySelector('link[rel="manifest"]')?.remove();
            var prefix = '[LOCAL] ';
            function ensureTitle() {
                var t = document.title || 'My Workspace';
                if (t.indexOf(prefix) !== 0)
                    document.title = prefix + t.replace(/^\[LOCAL\]\s*/, '');
            }
            ensureTitle();
            var titleEl = document.querySelector('title');
            if (titleEl && typeof MutationObserver !== 'undefined')
                new MutationObserver(ensureTitle).observe(titleEl, { childList: true, characterData: true, subtree: true });

            function mountBar() {
                if (document.getElementById('local-env-banner')) return;
                var bar = document.createElement('div');
                bar.id = 'local-env-banner';
                bar.setAttribute('role', 'status');
                var full = document.createElement('span');
                full.className = 'local-env-banner-text local-env-banner-text-full';
                full.textContent = 'LOCAL — not production. This is your machine, not a deployed environment.';
                var short = document.createElement('span');
                short.className = 'local-env-banner-text local-env-banner-text-short';
                short.textContent = 'LOCAL — not production';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.id = 'local-env-banner-hide';
                btn.textContent = 'Hide 5 min';
                btn.setAttribute('aria-label', 'Hide this local banner for 5 minutes');
                btn.addEventListener('click', hideBar);
                bar.appendChild(full);
                bar.appendChild(short);
                bar.appendChild(btn);
                document.body.insertBefore(bar, document.body.firstChild);
            }

            function showBar() {
                document.documentElement.classList.add('local-env');
                if (document.body) mountBar();
            }

            function hideBar() {
                var until = Date.now() + hideMs;
                try { localStorage.setItem(hideKey, String(until)); } catch (e) { }
                document.documentElement.classList.remove('local-env');
                document.getElementById('local-env-banner')?.remove();
                scheduleRestore(until);
            }

            function scheduleRestore(until) {
                if (restoreTimer) clearTimeout(restoreTimer);
                var ms = until - Date.now();
                if (ms <= 0) {
                    try { localStorage.removeItem(hideKey); } catch (e) { }
                    showBar();
                    return;
                }
                restoreTimer = setTimeout(function () {
                    try { localStorage.removeItem(hideKey); } catch (e) { }
                    showBar();
                }, ms);
            }

            function startBar() {
                if (isHidden())
                    scheduleRestore(hiddenUntil());
                else
                    showBar();
            }

            if (document.body) startBar();
            else document.addEventListener('DOMContentLoaded', startBar);
        })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>My Workspace</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/intranet-rich-content.css" rel="stylesheet" />
    <link href="My.Client.styles.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="200x200" href="icon-logo-200.png" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a class="dismiss">&#x1F5D9;</a>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="js/browser-timezone.js"></script>
    <script src="js/header-search.js"></script>
    <script src="js/intranet-media.js"></script>
    <script src="js/quill-editor.js"></script>
    <script src="js/file-drop.js"></script>
    <script src="js/project-autocomplete.js"></script>
    <script>
        // On localhost, tear down any PWA service worker + caches BEFORE loading Blazor.
        // A stale SW or cached boot manifest can still cause SRI / 404 failures after rebuilds.
        // NOTE: the old "?cb= reload loop" symptom-fighter is gone — Debug builds disable WASM
        // asset fingerprinting (see My.Client.csproj), so filenames are stable and a stale boot
        // manifest resolves to a real file instead of 404'ing into an empty-body integrity error.
        (async function () {
            var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

            function showBootHelp(message) {
                var ui = document.getElementById('blazor-error-ui');
                if (!ui) return;
                ui.style.display = 'block';
                var extra = ui.querySelector('.boot-help');
                if (!extra) {
                    extra = document.createElement('div');
                    extra.className = 'boot-help';
                    extra.style.marginTop = '0.5rem';
                    extra.style.fontSize = '0.9rem';
                    ui.insertBefore(extra, ui.querySelector('.reload'));
                }
                extra.textContent = message;
            }

            if (isLocal) {
                if ('serviceWorker' in navigator) {
                    var regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(function (r) { return r.unregister(); }));
                }
                if ('caches' in window) {
                    var keys = await caches.keys();
                    await Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }
            } else if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js');
            }

            var blazor = document.createElement('script');
            blazor.src = '_framework/blazor.webassembly.js';
            blazor.onerror = function () {
                showBootHelp('Could not load blazor.webassembly.js. Restart the client with Scripts\\Dev-StartClient.ps1 -Clean.');
            };
            document.body.appendChild(blazor);
        })();
    </script>
    <script src="js/keyboard-page-nav.js"></script>
    </body>

</html>
