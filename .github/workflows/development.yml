# Push to development — graph is only the promote path.
#
#   Build & Test
#     → Check version vs master
#     → Create development >> master PR
#         (soft: notice + green when version not ahead, PAT missing, or PR exists)
#   Only Build & Test failure should email as a workflow failure.

name: Development

on:
  push:
    branches: [ development ]

run-name: Development — build, version gate, promote PR

concurrency:
  group: development
  cancel-in-progress: true

env:
  CSPROJ_PATH: My.Client/My.Client.csproj

jobs:
  build:
    name: Build & Test
    uses: ./.github/workflows/_build-and-test.yml

  # always() required when depending on a reusable-workflow job.
  check-version-vs-master:
    name: Check version vs master
    needs: [ build ]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      version_ready: ${{ steps.compare.outputs.version_ready }}
      head_version: ${{ steps.compare.outputs.head_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare HEAD <Version> to master
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          extract() { grep -oP '(?<=<Version>)[^<]+' "$1" 2>/dev/null | head -n1 || true; }

          HEAD_V=$(extract "$CSPROJ_PATH")
          git fetch origin master --depth=1 2>/dev/null || true
          git show "origin/master:$CSPROJ_PATH" > /tmp/master.csproj 2>/dev/null || echo "" > /tmp/master.csproj
          MASTER_V=$(extract /tmp/master.csproj)

          echo "development <Version>: ${HEAD_V:-<none>}"
          echo "master <Version>:      ${MASTER_V:-<none>}"
          echo "head_version=${HEAD_V}" >> "$GITHUB_OUTPUT"

          # Greenfield product: app version stays at 1.0.0 and is not a promote gate.
          # Open development → master when there are commits to promote.
          AHEAD=$(git rev-list --count "origin/master..HEAD" 2>/dev/null || echo "0")
          echo "commits ahead of master: ${AHEAD}"

          if [[ -z "$HEAD_V" ]]; then
            echo "::notice::No <Version> in ${CSPROJ_PATH} (still allowing promote by commit delta)."
          fi

          if [[ "$AHEAD" -gt 0 ]]; then
            echo "::notice::development is ${AHEAD} commit(s) ahead of master — promotion allowed (version HEAD=${HEAD_V:-none}, master=${MASTER_V:-none})."
            echo "version_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Nothing ahead of master — no promotion PR."
          echo "version_ready=false" >> "$GITHUB_OUTPUT"

      - name: Close stale development >> master PR if version not ready
        if: steps.compare.outputs.version_ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice::secrets.PAT is empty — skipping stale-PR close (manual close if needed)."
            exit 0
          fi
          EXISTING=$(gh pr list --base master --head development --state open \
                       --json number --jq '.[0].number' || true)
          if [[ -z "$EXISTING" ]]; then
            echo "No open development >> master PR."
            exit 0
          fi
          if ! gh pr close "$EXISTING" --comment "Closed automatically: development is green but has nothing ahead of master (already promoted or tips equal)."; then
            echo "::notice::Could not close PR #$EXISTING (auth/permission). Not failing the workflow."
            exit 0
          fi
          echo "Closed stale PR #$EXISTING"

  create-pr-to-master:
    name: Create PR development → master
    needs: [ build, check-version-vs-master ]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.check-version-vs-master.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Soft gate: version-not-ready is expected after a successful promote (or when
      # no bump landed). Must not fail the Development workflow / send failure email.
      - name: Decide whether to open a promotion PR
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          READY="${{ needs.check-version-vs-master.outputs.version_ready }}"
          VERSION="${{ needs.check-version-vs-master.outputs.head_version }}"
          echo "version_ready=${READY}"
          echo "head_version=${VERSION}"
          if [[ "$READY" != "true" ]]; then
            echo "::notice title=No promotion PR::development has nothing ahead of master (product version ${VERSION:-unknown})."
            {
              echo "## No promotion PR this run"
              echo "Build & Test passed. No commits ahead of master, so no development → master PR was opened."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_create=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Promotion ready (app version ${VERSION:-1.0.0})"
            echo "Opening or keeping the development → master promotion PR (greenfield product — version is not a bump gate)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_create == 'true'
        with:
          fetch-depth: 0

      - name: Verify master branch exists
        if: steps.gate.outputs.should_create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --heads origin master | grep -q 'refs/heads/master$'; then
            echo "::error::Remote branch 'master' does not exist."
            exit 1
          fi

      - name: Open development → master PR
        if: steps.gate.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice::secrets.PAT is empty — open the promotion PR manually (gh pr create --base master --head development)."
            {
              echo "## Promotion PR not opened automatically"
              echo "\`secrets.PAT\` is empty. Create the PR manually or set the PAT secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch origin master --depth=100
          AHEAD=$(git rev-list --count "origin/master..HEAD")
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "development is not ahead of master on commits; nothing to PR"
            exit 0
          fi

          EXISTING=$(gh pr list --base master --head development --state open \
                       --json number --jq '.[0].number' || true)
          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING already open (version-ready); leaving it"
            exit 0
          fi

          VERSION="${{ needs.check-version-vs-master.outputs.head_version }}"
          if ! gh pr create \
            --base master \
            --head development \
            --title "development → master" \
            --body "$(cat <<EOF
          ## Production promotion

          Opened after a **green** development Build & Test with commits ahead of master.

          My.Workspace is a greenfield product — app \`<Version>\` stays at **${VERSION:-1.0.0}** and is not bumped per feature.

          ### Next step
          **Merge this PR**. The Master workflow builds/tests and may create/update the GitHub Release for \`v${VERSION:-1.0.0}\`.
          EOF
          )"; then
            echo "::notice::gh pr create failed (auth, permissions, or PR already exists). Not failing the workflow."
            exit 0
          fi
