# Push to master — open-source / product release path (no Azure deploy).
#
# My.Workspace is a generic product for others to host. We do NOT publish to
# the author's Azure. Master only:
#
#   Detect app changes
#     → Build & Test
#     → Create GitHub Release v{Version} from My.Client/My.Client.csproj
#
# Downstream consumers deploy with their own Azure (or other) pipeline.

name: Master

on:
  push:
    branches: [ master ]

run-name: Master — build & release

concurrency:
  group: master
  cancel-in-progress: true

env:
  CSPROJ_PATH: My.Client/My.Client.csproj

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
          echo "Changed files:"; echo "$CHANGED"

          APP_CHANGED=false
          if grep -E '^(My\.Client/|My\.AzureFunction/|My\.DAL/|My\.Shared/|\.github/workflows/)' <<<"$CHANGED" >/dev/null; then
            APP_CHANGED=true
          fi
          echo "app_changed=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "app_changed=$APP_CHANGED"

  build:
    name: Build & Test
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.app_changed == 'true'
    uses: ./.github/workflows/_build-and-test.yml

  create-release:
    name: Create release
    needs: [ detect-changes, build ]
    if: >-
      always()
      && needs.detect-changes.outputs.app_changed == 'true'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ_PATH" | head -n1)
          if [[ -z "$V" ]]; then
            echo "::error::Could not parse <Version> from $CSPROJ_PATH"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation"
            exit 0
          fi
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "Automated release from master (v${{ steps.version.outputs.version }}). Built and tested on GitHub Actions. Consumers deploy with their own hosting." \
            --target "${{ github.sha }}"
